<!DOCTYPE html>
<html lang="en" data-theme="">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Drive — Notes</title>
  <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}?v={{ css_version }}">
  <link rel="stylesheet" href="{{ url_for('static', filename='drive.css') }}?v={{ css_version }}">
  <script>
    // Apply saved/system theme before paint to avoid a flash of the wrong theme.
    (function () {
      const saved = localStorage.getItem("theme");
      const dark = saved ? saved === "dark"
        : window.matchMedia("(prefers-color-scheme: dark)").matches;
      if (dark) document.documentElement.setAttribute("data-theme", "dark");
    })();
  </script>
</head>
<body class="drive-page">
  <header class="d-appbar">
    <button id="menu-toggle" class="icon-btn d-only-mobile" aria-label="Menu">☰</button>
    <a class="brand" href="#/">
      <span class="brand-mark">📒</span>
      <span class="brand-text">Drive</span>
    </a>
    <form id="search-form" class="d-search" autocomplete="off">
      <span class="search-icon" aria-hidden="true">🔍</span>
      <input type="search" id="search-input" placeholder="Search files, folders and text inside documents" aria-label="Search">
    </form>
    <div class="appbar-actions">
      <button id="theme-toggle" class="icon-btn" title="Toggle dark mode" aria-label="Toggle dark mode">🌙</button>
      <form method="POST" action="{{ url_for('logout') }}">
        <button type="submit" class="icon-btn" title="Sign out" aria-label="Sign out">⎋</button>
      </form>
    </div>
  </header>

  <div class="d-shell">
    <aside id="sidebar" class="d-sidebar">
      <div class="d-new-wrap">
        <button id="new-btn" class="d-new-btn" aria-haspopup="menu">＋ New</button>
        <div id="new-menu" class="d-menu hidden" role="menu">
          <button data-new="folder" role="menuitem">📁 New folder</button>
          <button data-new="note" role="menuitem">📝 New note</button>
          <hr>
          <button data-new="files" role="menuitem">⬆️ Upload files</button>
          <button data-new="dir" role="menuitem">🗂️ Upload folder</button>
        </div>
      </div>
      <nav class="d-nav">
        <a href="#/" data-nav="drive">🗄️ My Drive</a>
        <a href="#/recent" data-nav="recent">🕘 Recent</a>
        <a href="#/starred" data-nav="starred">⭐ Starred</a>
        <a href="#/trash" data-nav="trash">🗑️ Trash</a>
      </nav>
      <nav id="tag-nav" class="d-nav d-tags" aria-label="Tags"></nav>
      <div class="d-storage">
        <div class="d-storage-bar"><span id="storage-fill"></span></div>
        <p id="storage-text" class="muted">…</p>
      </div>
    </aside>

    <main id="main" class="d-main">
      <div class="d-toolbar">
        <nav id="crumbs" class="d-crumbs" aria-label="Breadcrumb"></nav>
        <span class="grow"></span>
        <select id="sort" class="sort-select" aria-label="Sort">
          <option value="name">Name</option>
          <option value="updated">Last modified</option>
          <option value="size">Size</option>
        </select>
        <button id="view-toggle" class="icon-btn" title="Toggle grid / list" aria-label="Toggle grid or list view">☷</button>
      </div>

      <div id="selbar" class="d-selbar hidden">
        <span id="sel-count"></span>
        <span class="grow"></span>
        <button data-sel="download" class="tbtn">⬇ Download</button>
        <button data-sel="move" class="tbtn">➜ Move</button>
        <button data-sel="star" class="tbtn">☆ Star</button>
        <button data-sel="trash" class="tbtn">🗑 Trash</button>
        <button data-sel="restore" class="tbtn hidden">↺ Restore</button>
        <button data-sel="forever" class="tbtn hidden">✕ Delete forever</button>
        <button data-sel="clear" class="tbtn">Clear</button>
      </div>

      <div id="trash-note" class="d-trash-note hidden">
        Items in the trash are deleted forever after <span id="trash-days">30</span> days.
        <button id="empty-trash" class="link-btn">Empty trash now</button>
      </div>

      <div id="items"></div>
      <section id="content-results" class="d-content-results hidden">
        <h3>Text found inside documents</h3>
        <div id="content-list"></div>
      </section>

      <div id="drop-overlay" class="d-drop hidden"><div>Drop to upload to <b id="drop-target">My Drive</b></div></div>
    </main>
  </div>

  <!-- hidden pickers -->
  <input type="file" id="pick-files" multiple hidden>
  <input type="file" id="pick-dir" webkitdirectory multiple hidden>

  <!-- context menu (shared by every item) -->
  <div id="ctx" class="d-menu hidden" role="menu"></div>

  <!-- uploads panel -->
  <section id="uploads" class="d-uploads hidden" aria-live="polite">
    <header>
      <span id="up-title">Uploads</span>
      <span class="grow"></span>
      <button id="up-collapse" class="d-x" aria-label="Collapse">▾</button>
      <button id="up-close" class="d-x" aria-label="Close">✕</button>
    </header>
    <div id="up-list"></div>
  </section>

  <!-- preview -->
  <div id="preview" class="d-preview hidden" role="dialog" aria-modal="true">
    <header>
      <button id="pv-close" class="d-x" aria-label="Close preview">✕</button>
      <span id="pv-name" class="pv-name"></span>
      <span class="grow"></span>
      <a id="pv-open" class="d-x" target="_blank" rel="noopener" title="Open in new tab">↗</a>
      <a id="pv-download" class="d-x" title="Download">⬇</a>
    </header>
    <button id="pv-prev" class="pv-nav pv-prev" aria-label="Previous">‹</button>
    <div id="pv-body" class="pv-body"></div>
    <button id="pv-next" class="pv-nav pv-next" aria-label="Next">›</button>
  </div>

  <!-- generic dialog (prompt / confirm / move) -->
  <div id="dialog" class="d-dialog-wrap hidden">
    <form id="dialog-form" class="d-dialog" method="dialog">
      <h3 id="dlg-title"></h3>
      <div id="dlg-body"></div>
      <div class="d-dialog-actions">
        <button type="button" id="dlg-cancel" class="btn-secondary">Cancel</button>
        <button type="submit" id="dlg-ok">OK</button>
      </div>
    </form>
  </div>

  <div id="toasts" class="toasts" aria-live="polite"></div>
  <script src="{{ url_for('static', filename='drive.js') }}?v={{ css_version }}"></script>
</body>
</html>
